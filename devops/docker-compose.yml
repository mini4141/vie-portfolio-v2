# Run from the devops/ folder:  cp .env.example .env && docker compose up -d --build
# Add continuous backups:       docker compose --profile backup up -d
name: vie

services:
  app:
    build:
      context: ..
      dockerfile: devops/Dockerfile
    restart: unless-stopped
    environment:
      SITE_URL: https://${SITE_DOMAIN:-localhost}
      TRUST_PROXY: "1"
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
    volumes:
      - data:/data          # named volume: SQLite WAL is unreliable on Windows/Docker bind mounts
    expose:
      - "4321"
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  litestream:
    image: litestream/litestream:0.3
    profiles: ["backup"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    command: replicate -config /etc/litestream.yml
    environment:
      LITESTREAM_BUCKET: ${LITESTREAM_BUCKET:-}
      LITESTREAM_REGION: ${LITESTREAM_REGION:-}
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID:-}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY:-}
    volumes:
      - data:/data
      - ./litestream.yml:/etc/litestream.yml:ro

volumes:
  data:
  caddy_data:
  caddy_config:
