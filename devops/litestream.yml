# Continuous SQLite backup to S3-compatible storage. Needs LITESTREAM_BUCKET, LITESTREAM_REGION,
# LITESTREAM_ACCESS_KEY_ID and LITESTREAM_SECRET_ACCESS_KEY (see devops/.env.example).
# LITESTREAM_ENDPOINT is only for non-AWS services, e.g. Cloudflare R2: https://<account id>.r2.cloudflarestorage.com
# (with region "auto"); leave it empty for AWS S3.
dbs:
  - path: /data/app.db
    replicas:
      - type: s3
        bucket: ${LITESTREAM_BUCKET}
        path: vie/app.db
        endpoint: ${LITESTREAM_ENDPOINT}
        region: ${LITESTREAM_REGION}
        retention: 168h
